[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scald-defense"
version = "0.1.0"
description = "SCALD — Split-Context Attack Layered Defense: multi-layer defense-in-depth against split-context prompt injection in tool-using AI agents"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Praveen Biram" }]
keywords = ["prompt-injection", "llm-security", "ai-agents", "tool-use", "defense"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Intended Audience :: Science/Research",
    "Topic :: Security",
]
dependencies = [
    "openai>=1.30,<4",
    "anthropic>=0.25,<2",
    "datasets>=2.19,<6",
    "rich>=13.7,<16",
    "python-dotenv>=1.0,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[project.urls]
Homepage = "https://github.com/PRAVEEN1404B/scald"
Repository = "https://github.com/PRAVEEN1404B/scald"
Issues = "https://github.com/PRAVEEN1404B/scald/issues"

[tool.setuptools]
# Top-level modules used by the experiment scripts ...
py-modules = ["agent", "config", "tools", "defense"]
# ... plus the defence/metrics/benchmark packages.
packages = ["defence", "metrics", "benchmarks", "demo"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
target-version = "py310"
line-length = 120
exclude = ["venv", "InjecAgent", "logs", "results", "__pycache__"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
# E501 is handled by the formatter / line-length setting, not enforced as a hard error.
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# The case generator and verifier are deliberately compact, data-heavy scripts.
"build_cases.py" = ["E701", "E731"]
"verify_cases.py" = ["E401", "E402", "E701", "E702", "E741"]
